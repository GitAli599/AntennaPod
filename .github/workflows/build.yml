name: Build

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper analysis context

      # 2️⃣ Set up Java (adjust version if needed)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Build the project (for Maven)
      - name: Build with Maven
        run: mvn -B clean verify

      # 4️⃣ Run the SonarQube/SonarCloud analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=my-org_my-project
            -Dsonar.organization=my-org
            -Dsonar.java.binaries=target/classes
